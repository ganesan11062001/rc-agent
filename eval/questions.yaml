# Retrieval eval. Each question is phrased the way a researcher writes a
# ticket, not the way the site words its headings, so a pass means retrieval
# bridged the vocabulary gap rather than matched a title.
#
# expected_urls are page URLs (no fragment, no trailing slash). A retrieved
# section counts as a hit if it is on any listed page. List every page that
# genuinely answers the question; a page that merely mentions the topic does
# not belong here.
#
# Written 2026-10-22 against the page inventory of that date.

questions:
  - question: "My Slurm job died and sacct says OUT_OF_MEMORY. What should I change?"
    expected_urls:
      - https://rc.northeastern.edu/2025/11/04/debugging-unexpected-job-termination-on-explorer

  - question: "My interactive session keeps getting cancelled even though I'm still using it"
    expected_urls:
      - https://rc.northeastern.edu/2025/11/04/debugging-unexpected-job-termination-on-explorer

  - question: "How can I see how much CPU and memory my finished jobs actually used?"
    expected_urls:
      - https://rc.northeastern.edu/2025/03/27/job-efficiency-historical-seff

  - question: "My GPU job is stuck pending. What are the GPU partition time and job limits?"
    expected_urls:
      - https://rc.northeastern.edu/partitions

  - question: "I need to run jobs longer than 48 hours, how do I get access to the long partition?"
    expected_urls:
      - https://rc.northeastern.edu/partitions
      - https://rc.northeastern.edu/service-catalog

  - question: "I'm a new PhD student, how do I get an account on the cluster?"
    expected_urls:
      - https://rc.northeastern.edu/getting-access

  - question: "How do I copy my files from Explorer over to the AICR cluster?"
    expected_urls:
      - https://rc.northeastern.edu/aicr/aicr-transferring-data

  - question: "Files disappeared from my scratch directory, are they deleted automatically?"
    expected_urls:
