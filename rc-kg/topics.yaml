# Hand-maintained topic list. Sections are linked to a topic only when one of
# its aliases appears in the section (whole word, case-insensitive) -- nothing
# here is generated, and nothing outside this file can become a Topic.
#
# Aliases are matched as phrases, so keep them specific: "job" would tag half
# the site, "out of memory" tags the sections that are actually about it.
# Written from the page and heading inventory on 2026-10-22.

