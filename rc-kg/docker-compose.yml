# Neo4j for laptops and any host that actually has a container runtime.
#
# NOT the path used on Explorer. The compute nodes have no docker, podman,
# apptainer or singularity, so on the cluster use scripts/start_neo4j.sh, which
# runs the same Neo4j 5.26 from a tarball under the plain user account. Both
# produce an identical database; only the launcher differs.
#
#   docker compose up -d
#   # then put the bolt URL and password in .env:
#   #   NEO4J_URI=bolt://127.0.0.1:7687
#   #   NEO4J_PASSWORD=<NEO4J_PASSWORD below>

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: rc_kg_neo4j
    # Loopback only. The graph holds no secrets, but it is an internal service
    # and there is no reason for it to be reachable from the network.
    ports:
      - "127.0.0.1:7474:7474"   # HTTP browser
      - "127.0.0.1:7687:7687"   # Bolt
    environment:
      # Override before first start; the volume keeps whatever was set then.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme-before-first-start}"
      NEO4J_server_memory_heap_initial__size: "1g"
      NEO4J_server_memory_heap_max__size: "2g"
      NEO4J_server_memory_pagecache_size: "512m"
      # Vector and fulltext indexes are built in to 5.26; no plugins needed.
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      # Checks Bolt is answering, not just that the process exists.
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_PASSWORD:-changeme-before-first-start}\" 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
