---
cluster: explorer

form:
  - bc_num_hours
  - partition
  - gpu_layout
  - rc_model

attributes:
  bc_num_hours:
    widget: number_field
    label: "Hours"
    value: 1
    min: 1
    max: 8
    step: 1
    help: >-
      Capped by the partition: gpu-interactive and gpu-short allow 2 hours,
      gpu allows 8. The box tightens itself when you change partition. The
      model takes a few minutes to load, so a 1-hour session gives roughly
      50 minutes of drafting.

  partition:
    widget: select
    label: "Partition"
    value: "gpu-interactive"
    options:
      - [ "gpu-interactive - for OOD sessions (recommended)", "gpu-interactive",
          data-max-bc-num-hours: 2 ]
      - [ "gpu-short - 2 h, higher priority", "gpu-short",
          data-max-bc-num-hours: 2 ]
      - [ "gpu - up to 8 h, longer queue", "gpu",
          data-max-bc-num-hours: 8 ]
      - [ "multigpu - needs approval, required for 2+ GPUs", "multigpu",
          data-max-bc-num-hours: 24 ]
    help: >-
      gpu-interactive is the partition RC documents for Open OnDemand sessions.
      All the general-access GPU partitions allow only ONE GPU per job; 2 or
      more requires multigpu, which needs prior approval.
      See https://rc.northeastern.edu/partitions

  gpu_layout:
    widget: select
    label: "GPUs"
    value: "any"
    options:
      - ["Any free GPU - T4, A100 or H200, whichever starts first (recommended)", "any"]
      - ["1 x T4 16GB - 4-bit models", "t4"]
      - ["1 x A100 80GB or H200 - 32K context, full-precision GLM", "1x80"]
      - ["1 x A100 40GB - up to Qwen2.5-7B at fp16", "1x40"]
      - ["2 x A100 - 131K context, needs multigpu approval", "2x"]
      - ["4 x A100 - GLM-4.5-Air, needs multigpu approval", "4x"]
    help: >-
      "Any free GPU" asks for one GPU and excludes every V100 node, so the job
      starts on the first T4, A100 or H200 that frees up. It suits the 4-bit
      models and the 3B test model, which fit even a 16 GB T4. The fp16 and GLM
      models need more memory and pick their own GPU whatever is chosen here.
      Never V100 - torch has no sm_70 kernels.

  rc_model:
    widget: select
    label: "Model"
    value: "t4-7b"
    options:
      - ["Qwen2.5-7B AWQ - 4-bit, fits any GPU (recommended)", "t4-7b"]
      - ["Qwen2.5-14B AWQ - 4-bit, tight on a T4, 8K context", "t4-14b"]
      - ["Qwen2.5-3B - smoke test only, weakest drafts", "small"]
      - ["Qwen2.5-7B fp16 - needs an A100 40GB", "qwen7b"]
      - ["GLM-4.7-Flash (30B MoE) - needs an A100 80GB or H200", "flash"]
      - ["GLM-4.5-Air (106B) - 4 GPUs, multigpu approval", "air"]
    help: >-
      The AWQ builds are 4-bit and fit any usable GPU; the fp16 and GLM builds
      need an A100 or H200 and override the GPU choice. Qwen2.5-3B is only for
      proving the pipeline - its drafts are noticeably weaker.
